name: Pruebas

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias, de componentes y de integración
        run: npm test
      - name: Compilación
        run: npm run build
      - name: Navegador para pruebas funcionales
        run: npx playwright install --with-deps chromium
      - name: Pruebas funcionales (end-to-end)
        run: npm run test:e2e
