name: Comprobar VisioStock
# Pruebas funcionales + pruebas de seguridad (SCRUM-65).
# Corre en cada push de CUALQUIER rama, así los errores de seguridad se
# detectan en la rama propia antes de abrir el PR hacia main.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Validar cabeceras y CSP
        env:
          VITE_VISION_URL: ${{ vars.VITE_VISION_URL || 'https://vastec-portatil.tail86ca65.ts.net' }}
        run: node --test tests/cabeceras.test.mjs
      - run: npm run build
  vision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vision/requirements-test.txt
      - run: python -m pip install -r vision/requirements-test.txt
      - run: python -m unittest discover -s vision -p "test_*.py"

  # ---------- Seguridad ----------
  seguridad-dependencias-web:
    name: Seguridad · dependencias web (npm audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # Falla si hay vulnerabilidades de severidad moderada o mayor.
      - run: npm audit --package-lock-only --audit-level=moderate

  seguridad-dependencias-vision:
    name: Seguridad · dependencias visión (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      # Falla si alguna dependencia tiene una vulnerabilidad conocida.
      - name: Auditar dependencias de producción
        run: pip-audit -r vision/requirements.txt
      - name: Auditar dependencias de pruebas
        if: ${{ !cancelled() }}
        run: pip-audit -r vision/requirements-test.txt

  seguridad-secretos:
    name: Seguridad · secretos expuestos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Falla si encuentra claves, tokens o contraseñas en el historial.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  seguridad-sql:
    name: Seguridad · políticas SQL (RLS y doble factor)
    runs-on: ubuntu-24.04
    # PostgreSQL real con lo mínimo de Supabase Auth (supabase/ci/stub_supabase.sql).
    # Falla si un usuario ve datos de otra empresa o si una sesión sin el segundo factor
    # (AAL1) accede a datos de una cuenta que tiene el doble factor activo (SCRUM-74).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Cargar esquema y migraciones de seguridad
        run: |
          for f in supabase/ci/stub_supabase.sql supabase/esquema.sql supabase/10_doble_factor.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Prueba de aislamiento entre empresas
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/prueba_aislamiento.sql
      - name: Prueba de doble factor exigido por la base de datos
        run: psql -v ON_ERROR_STOP=1 -f supabase/prueba_doble_factor.sql

  seguridad-codigo:
    name: Seguridad · análisis estático (CodeQL ${{ matrix.lenguaje }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.lenguaje }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: /language:${{ matrix.lenguaje }}
          output: resultados-codeql
      # CodeQL solo publica alertas; este paso hace que el pipeline falle
      # si encontró algún problema de seguridad.
      - name: Fallar si CodeQL encontró problemas
        run: |
          total=$(jq -s '[.[].runs[].results[]] | length' resultados-codeql/*.sarif)
          echo "Hallazgos de CodeQL: $total"
          jq -r '.runs[].results[] | "- \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' resultados-codeql/*.sarif
          test "$total" -eq 0
